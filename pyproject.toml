[project]
name = "source-to-screen"
version = "0.1.1"
description = "Align a film or series with its source work (novel, play, story, earlier film): source text against subtitles and shots, to ground an adaptation comparison."
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.7",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pysubs2>=1.9.0",
    "rapidfuzz>=3.9",
]

[project.scripts]
source-to-screen = "source_to_screen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/source_to_screen"]
